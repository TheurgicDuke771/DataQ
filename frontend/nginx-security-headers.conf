# Security response headers (#1387) — included from nginx.conf.template PER LOCATION:
# nginx drops inherited `add_header` wherever a location declares its own, so a single
# server-level block would silently vanish from exactly the locations that set Cache-Control
# (incl. `location /`). `always` so headers ride error responses too.

# Clickjacking. `frame-ancestors` in the CSP below is the modern control and
# supersedes this, but X-Frame-Options is what pre-CSP3 browsers honour.
add_header X-Frame-Options "DENY" always;

# Stop content-type sniffing. Matters most on /assets/* — a JS bundle mislabelled
# by an upstream proxy must not be re-interpreted as something executable.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak in-app paths (which carry run/suite/asset UUIDs) to third parties
# via Referer, while keeping same-origin referrers intact for our own navigation.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# DataQ asks for none of these. Explicitly denying them means an injected iframe
# or script cannot ask on our origin's behalf.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS. Inert on plain HTTP (compose), active behind CloudFront/ACA — one image, both.
# `preload` deliberately NOT set: not our hostname to submit, and effectively irreversible.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP, assembled in nginx.conf.template (it needs runtime env). nginx omits an `add_header` whose
# value evaluates to the empty string.
add_header Content-Security-Policy $dataq_csp always;
