# DataQ — run from prebuilt GHCR images, NO source checkout required (#472).
#
#   export OPENBAO_TOKEN=$(openssl rand -hex 16)     # one-off (secret store)
#   export DATAQ_SIGNIN_EMAIL=you@example.com        # who may sign in (#1150)
#   docker compose -f docker-compose.ghcr.yml up
#
# Add `--profile demo` for a sample warehouse that is already connected, with suites that run.
#
# Open https://localhost:3000. The certificate comes from a CA generated on first start, so
# the browser warns until you trust it (see the install guide).
#
# Signs you in with an emailed one-time code (ADR 0032); read the code at the
# bundled inbox http://localhost:8025. Omitting DATAQ_SIGNIN_EMAIL stops the stack.
#
# Production-like on purpose: the UI (:3000) is the only way in, as in a real deployment
# (ADR 0028 §5). The api, database, Redis and vault publish no host port; the api is reached
# through the UI's /api, /mcp and /healthz proxy. The inbox (:8025) is the one other port.

x-backend-image: &backend-image "ghcr.io/theurgicduke771/dataq-backend:${DATAQ_BACKEND_TAG:-latest}"

# Every backend container mounts the local CA's public certificate to verify the stack's own
# servers (Postgres, Redis, SMTP).
x-app-volumes: &app-volumes
  - ghcr_local_ca:/certs:ro

# Shared app env for api/worker/migrate.
x-app-env: &app-env
  # prod: /docs is not served and the contributor bypass is refused. Contributors using the
  # bypass on this file set DATAQ_ENVIRONMENT=dev (CONTRIBUTING.md).
  ENVIRONMENT: ${DATAQ_ENVIRONMENT:-prod}
  RATE_LIMIT_ENABLED: "true"
  # TLS to the stack's own datastores, verified against the local CA: the same client code
  # paths a managed Postgres or Redis exercises in production.
  DATABASE_URL: "postgresql+psycopg2://dataq@postgres:5432/dataq?sslmode=verify-full&sslrootcert=/certs/ca.pem"
  REDIS_URL: "rediss://redis:6379/0?ssl_cert_reqs=required&ssl_ca_certs=/certs/ca.pem"
  SECRET_STORE: "openbao"
  OPENBAO_ADDR: "http://openbao:8200"
  OPENBAO_TOKEN: ${OPENBAO_TOKEN:?required — see the header of this file (ADR 0039)}
  # Contributors only (CONTRIBUTING.md "Developer bypass"); the api refuses it beside a real mode.
  AUTH_DEV_BYPASS: ${DATAQ_DEV_BYPASS:-false}
  # Email OTP sign-in against the bundled catcher.
  AUTH_EMAIL_SMTP_HOST: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_SMTP_HOST:-mailpit}}
  AUTH_EMAIL_SMTP_PORT: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_SMTP_PORT:-1025}}
  # STARTTLS to the bundled catcher, verified against the local CA. Pointing at a real relay:
  # set AUTH_EMAIL_CA_BUNDLE to empty so its public certificate is checked the usual way.
  AUTH_EMAIL_TLS_MODE: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_TLS_MODE:-starttls}}
  AUTH_EMAIL_CA_BUNDLE: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_CA_BUNDLE-/certs/ca.pem}}
  # A SecretStore lookup NAME, never a value — the password is generated into the vault by the `otp-
  # mail-secret` one-shot and read back by name.
  AUTH_EMAIL_PASSWORD_SECRET_NAME: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_PASSWORD_SECRET_NAME:-dataq-local-smtp}}
  # Non-secret identifiers; mailpit accepts ANY credentials, so what matters is
  # only that the api's real SMTP AUTH exchange happens.
  AUTH_EMAIL_USERNAME: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_USERNAME:-dataq-local}}
  AUTH_EMAIL_FROM: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_FROM:-dataq@dataq.local}}
  # Mandatory signup allowlist — there is no open registration (ADR 0032 decision 5).
  AUTH_OTP_ALLOWED_EMAILS: ${DATAQ_SIGNIN_EMAIL?set DATAQ_SIGNIN_EMAIL=you@example.com to sign in with an emailed code (read it at http://localhost:8025). it must be set}
  # Whoever booted the stack administers it; the dev-bypass identity is listed only when opted in.
  WORKSPACE_ADMIN_EMAILS: ${DATAQ_DEV_BYPASS:+dev-bypass@dataq.local,}${DATAQ_SIGNIN_EMAIL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # trust-auth: no password set or required (eval only). Keeps any credential
      # out of this git-tracked file (CLAUDE.md). user/db are non-secret names.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: dataq
      POSTGRES_DB: dataq
    command: postgres -c ssl=on -c ssl_cert_file=/tls/cert.pem -c ssl_key_file=/tls/key.pem
    depends_on:
      local-ca:
        condition: service_completed_successfully
    volumes:
      - ghcr_tls_postgres:/tls:ro
      # Distinct from docker-compose.yml's volume: this stack runs trust-auth, so it must never
      # reuse a password-initialized data dir (auth config is fixed at init time).
      - ghcr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # TLS only: the plain port is off.
    command: >-
      redis-server --port 0 --tls-port 6379
      --tls-cert-file /tls/cert.pem --tls-key-file /tls/key.pem
      --tls-ca-cert-file /certs/ca.pem --tls-auth-clients no
    depends_on:
      local-ca:
        condition: service_completed_successfully
    volumes:
      - ghcr_tls_redis:/tls:ro
      - ghcr_local_ca:/certs:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.pem", "-h", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Credential store (ADR 0039).
  openbao:
    image: openbao/openbao:2.6.1
    restart: unless-stopped
    environment:
      # No default: a credential must never ship in a tracked file (CLAUDE.md §11).
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN:?required — see the header of this file (ADR 0039)}
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK           # lock memory so secrets cannot be swapped to disk
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Bundled mail catcher — the local mailbox for OTP sign-in (#1150) ─────────
  # Mailpit (MIT — rule 40 / ADR 0031 clear) catches every message DataQ sends and
  # serves it in a web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      # Without ACCEPT_ANY the server advertises no AUTH at all and smtplib's `login()` raises
      # SMTPNotSupportedError. AUTH is only offered after STARTTLS.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_TLS_CERT: /tls/cert.pem
      MP_SMTP_TLS_KEY: /tls/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      # Loopback ONLY, and more strictly than the rest of this file: this inbox holds LIVE sign-in
      # codes for every allow-listed address, behind no authentication at all.
      - "127.0.0.1:8025:8025"   # web inbox — open this to read your code
    depends_on:
      local-ca:
        condition: service_completed_successfully
    volumes:
      - ghcr_tls_mailpit:/tls:ro

  # One-shot: a local certificate authority and a `localhost` certificate, generated on first
  # start into a volume and kept across restarts. root only so it can write the fresh volumes.
  # The CA private key has a volume of its own that no other service mounts.
  local-ca:
    image: *backend-image
    restart: "no"
    user: "0:0"
    # NAME:DIR:UID — a certificate for that hostname, its key owned by the user the service
    # runs as (postgres 70, redis 999, mailpit root).
    command: >-
      python -m backend.scripts.local_ca /certs /ca-key --localhost-dir /tls/frontend
      --service postgres:/tls/postgres:70
      --service redis:/tls/redis:999
      --service mailpit:/tls/mailpit:0
    volumes:
      - ghcr_local_ca:/certs
      - ghcr_local_ca_key:/ca-key
      - ghcr_tls_frontend:/tls/frontend
      - ghcr_tls_postgres:/tls/postgres
      - ghcr_tls_redis:/tls/redis
      - ghcr_tls_mailpit:/tls/mailpit

  # One-shot: puts a generated SMTP password in the vault under the name the api looks it up by,
  # then exits 0.
  otp-mail-secret:
    image: *backend-image
    restart: "no"
    command: python -m backend.scripts.seed_local_smtp_secret
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      openbao:
        condition: service_healthy
      # Settings refuses to load while AUTH_EMAIL_CA_BUNDLE names a file that is not there yet.
      local-ca:
        condition: service_completed_successfully

  # One-shot: migrate to head THEN seed the dev user + probe fixtures + demo data (seed_dev is
  # idempotent, safe to re-run on every `up`). api/worker gate on its successful completion so the
  # stack never serves an un-migrated/empty schema.
  migrate:
    image: *backend-image
    restart: "no"
    command: sh -c "cd backend && alembic upgrade head && cd .. && python -m backend.scripts.seed_dev"
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy

  api:
    image: *backend-image
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otp-mail-secret:
        condition: service_completed_successfully

  worker:
    image: *backend-image
    restart: unless-stopped
    # -Q celery,llm (#1777): llm_invoke has its own queue now — must be listed or never consumed.
    # NO -B (#1811): beat runs as its own `beat` service below, so a worker OOM can never take the
    # scheduler down with it (the #405 class).
    command: celery -A backend.app.worker.celery_app worker -Q celery,llm --loglevel=INFO
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otp-mail-secret:
        condition: service_completed_successfully

  # celery-beat, split out of the worker (#1811). ONE instance only — never scale this service, or
  # every periodic task (orchestration polling, scheduled dispatch, sweeps) fires twice.
  beat:
    image: *backend-image
    restart: unless-stopped
    command: celery -A backend.app.worker.celery_app beat --loglevel=INFO
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otp-mail-secret:
        condition: service_completed_successfully

  # ── Demo profile (#1706): `docker compose -f docker-compose.ghcr.yml --profile demo up` ─────
  # A sample warehouse with a small shop dataset and deliberate defects, connected and runnable:
  # the seed creates the DataQ connection, two suites and an hourly schedule, and starts a first
  # run of each suite. trust-auth like `postgres` above (eval only) and no host port: it is
  # reachable only inside this compose network.
  demo-warehouse:
    image: postgres:16-alpine
    profiles: ["demo"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: demo
      POSTGRES_DB: shop
    volumes:
      - ghcr_demo_warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-seed:
    image: *backend-image
    profiles: ["demo"]
    restart: "no"
    command: python -m backend.scripts.seed_demo
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      demo-warehouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy

  # The UI image (nginx), and the stack's only public surface.
  frontend:
    image: "ghcr.io/theurgicduke771/dataq-frontend:${DATAQ_FRONTEND_TAG:-latest}"
    restart: unless-stopped
    environment:
      # The SECOND of the two coordinated mode selectors (ADR 0032 decision 2) — the backend cannot
      # infer this one, and vice versa.
      DATAQ_AUTH_MODE: ${DATAQ_AUTH_MODE:-otp}
      # TLS ends here, as it does at a production edge.
      DATAQ_TLS_CERT: /tls/localhost.pem
      DATAQ_TLS_KEY: /tls/localhost.key
      # Off: HSTS binds the host `localhost`, not this port, and would force HTTPS on the
      # inbox (:8025) and anything else you run locally.
      DATAQ_HSTS: ""
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ghcr_tls_frontend:/tls:ro
      # The CA's public certificate only, so `docker compose cp frontend:/certs/ca.pem .` works.
      - ghcr_local_ca:/certs:ro
    depends_on:
      api:
        condition: service_started
      local-ca:
        condition: service_completed_successfully

volumes:
  ghcr_postgres_data:
  ghcr_local_ca:
  ghcr_local_ca_key:
  ghcr_tls_frontend:
  ghcr_tls_postgres:
  ghcr_tls_redis:
  ghcr_tls_mailpit:
  ghcr_demo_warehouse_data:
