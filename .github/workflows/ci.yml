name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: pip install -r backend/requirements-tooling.txt

      - name: Black (format check)
        run: black --check backend/

      - name: Ruff (lint)
        run: ruff check backend/

  backend-types:
    name: Backend — type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install type-check deps
        # mypy from the tooling file; the typed subset it checks against.
        run: |
          pip install -r backend/requirements-tooling.txt
          pip install -r backend/requirements-typecheck.txt

      - name: mypy
        run: mypy backend/app/

  backend-sast:
    name: Backend — SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Bandit
        run: pip install -r backend/requirements-tooling.txt

      - name: Bandit
        run: bandit -c pyproject.toml -r backend/app/

  python-client:
    name: Python client (dataq-client) — drift, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the package and its tooling
        run: |
          pip install -r packages/dataq-client/requirements-dev.txt
          pip install -e packages/dataq-client

      - name: Generated client matches the committed OpenAPI spec
        # The spec itself is checked against the app in backend-test; a route change must
        # regenerate both (scripts/generate-dataq-client.py).
        run: python scripts/generate-dataq-client.py --check

      - name: Types (hand-written layer)
        run: mypy --config-file packages/dataq-client/pyproject.toml packages/dataq-client/src/dataq_client/client.py packages/dataq-client/src/dataq_client/cli.py

      - name: Tests
        run: pytest -c packages/dataq-client/pyproject.toml -q -p no:cacheprovider packages/dataq-client/tests

      - name: Runtime licences (no strong copyleft or source-available)
        run: python packages/dataq-client/scripts/check_licences.py

      - name: Build the wheel
        run: python -m build --wheel packages/dataq-client --outdir /tmp/dist

  backend-audit:
    name: Backend — dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==2.10.0

      - name: pip-audit (full runtime + test surface)
        # Synchronous CVE gate over the entire runtime + test dependency tree (single source:
        # requirements-dev.txt) + transitive deps, against the PyPI/OSV advisory DB.
        run: |
          # CVE-2026-49265 is in oauthlib's authorization-server PKCE check, which DataQ never runs;
          # databricks-sql-connector pins oauthlib<4.0.0, so the fix can't be installed yet (#2260).
          audit() {
            pip-audit -r backend/requirements-dev.txt --ignore-vuln CVE-2026-49265 \
              && pip-audit -r packages/dataq-client/requirements-dev.txt
          }
          for attempt in 1 2 3 4; do
            if audit; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pip-audit attempt $attempt failed (likely a transient PyPI/OSV 5xx) — retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::pip-audit failed after 4 attempts — a real CVE or a persistent PyPI/OSV outage (see log above)"
          exit 1

  backend-test:
    name: Backend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ephemeral Postgres for DB-backed integration tests (seed/run/endpoint).
    services:
      postgres:
        image: ghcr.io/theurgicduke771/ci-postgres:16-alpine
        env:
          POSTGRES_USER: dataq
          POSTGRES_PASSWORD: dataq
          POSTGRES_DB: dataq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis broker for the real-broker E2E (dispatch -> worker round-trip).
      redis:
        # GHCR mirror of redis:7-alpine (#993 rate limits). The :7 tag is a SECURITY
        # gate, not staleness — Redis 8 bundles Vector Sets (unpatched RCE); Dependabot
        # does not watch service images. Read #980 before any bump.
        image: ghcr.io/theurgicduke771/ci-redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test deps
        # Single source of truth: runtime + typed subset + test toolchain, all
        # from backend/requirements-dev.txt. pip upgraded for PYSEC-2026-196.
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements-dev.txt

      - name: mypy (tests)
        # The slim `Backend — type check` job mypies backend/app against the typed subset; this
        # gates backend/tests too — run here.
        run: mypy backend/tests/

      - name: pytest
        # TEST_DATABASE_URL enables the db_session fixture; DATABASE_URL + REDIS_URL + DATAQ_E2E
        # together enable the real-broker E2E (test_probe_e2e — DATAQ_E2E is the explicit-opt-in
        # signal conftest.py's DATABASE_URL auto-redirect (#1130) can never set on its own, so this
        # test stays a conscious choice even here).
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_test
          DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_test
          REDIS_URL: redis://localhost:6379/0
          DATAQ_E2E: "1"
        run: pytest backend/tests/

      # The docs site's OpenAPI spec + MCP tool table are generated from the app; a change to
      # a route or a tool docstring must regenerate them (backend/scripts/export_docs_reference.py).
      - name: Docs reference artifacts match the app (openapi.json, mcp-tools.md)
        env:
          DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_test
          REDIS_URL: redis://localhost:6379/0
        run: python -m backend.scripts.export_docs_reference --check

      # Scale-baseline regression budget, deterministic metrics only: the work each case
      # reports doing (exact) and the statements + store calls it costs (strict). Peak RSS
      # and encoded byte counts are platform-dependent, so their band is NOT enforced here;
      # wall clock is measured and recorded but never gated — a shared runner cannot hold it
      # steady, and a flaky gate is worse than none. Runs inside this job so the branch
      # ruleset's required-check names do not change.
      - name: Perf regression budget (deterministic subset)
        env:
          PERF_DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_perf_ci
          PERF_DATA_DIR: ${{ runner.temp }}/perf-data
        run: |
          python -m backend.scripts.perf_baseline create-db
          (cd backend && DATABASE_URL="$PERF_DATABASE_URL" alembic upgrade head)
          python -m backend.scripts.perf_baseline check --gate exact --gate strict

  # ── Leak prevention: secrets (betterleaks) + identifiers (#1472) ───────────── The job keeps its
  # original NAME because that string is the required-status-check context in the `main` ruleset.
  secrets:
    name: Secret scanning (betterleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scan only the commits THIS event introduces, not the whole history.
      - name: Compute commit range to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "logopts=--no-merges ${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # new branch / no parent on record — scan just the tip commit
            echo "logopts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "logopts=--no-merges ${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          fi

      # Betterleaks has no official GitHub Action; run the official pinned container image.
      - name: Run betterleaks (incremental — only this event's new commits)
        env:
          LOGOPTS: ${{ steps.range.outputs.logopts }}
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/betterleaks/betterleaks:v1.4.1 \
            git /repo --config /repo/.betterleaks.toml --redact --verbose \
            --git-workers=4 \
            --log-opts="$LOGOPTS"

      # Backstop for the pre-commit hooks of the same name.
      - name: No personal or live-infrastructure identifiers
        run: python scripts/check-identifiers.py

      - name: Every doc declares published or not
        run: python scripts/check-docs-publication.py

      - name: Published docs don't cite tickets or link internal docs
        run: python scripts/check-docs-references.py

      - name: Docs assets stay small and every image has alt text
        run: python scripts/check-docs-assets.py

      - name: Frontend UI text doesn't cite ADR/issue/PR numbers
        run: python scripts/check-frontend-no-ticket-refs.py

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      # Backstop for the pre-commit hook of the same name: the published check-type
      # reference must match the editor catalog + backend allowlist it is generated from.
      - name: Check-type reference is generated from the catalog + allowlist
        working-directory: .
        run: python3 scripts/docs/gen-check-catalog.py --check

  frontend-test:
    name: Frontend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest (80% line-coverage gate — CI-enforced since the v1 W8 flip)
        run: pnpm test:coverage

  frontend-e2e:
    name: Frontend — browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Full-stack browser smoke (#128): real API + seeded demo data + dev-bypass, driven through the
    # React UI.
    services:
      postgres:
        image: ghcr.io/theurgicduke771/ci-postgres:16-alpine
        env:
          POSTGRES_USER: dataq
          POSTGRES_PASSWORD: dataq
          POSTGRES_DB: dataq_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        # GHCR mirror of redis:7-alpine (#993 rate limits). The :7 tag is a SECURITY
        # gate, not staleness — Redis 8 bundles Vector Sets (unpatched RCE); Dependabot
        # does not watch service images. Read #980 before any bump.
        image: ghcr.io/theurgicduke771/ci-redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_e2e
      REDIS_URL: redis://localhost:6379/0
      # api + seed must share the secret store so secrets the seed writes are readable by the api
      # (compose parity).
      SECRET_STORE: openbao
      OPENBAO_ADDR: http://localhost:8200
      AUTH_DEV_BYPASS: "true"
      ENVIRONMENT: dev
      # dev-bypass identity is workspace admin (compose parity, ADR 0027) so
      # admin.spec.ts can drive /admin + /settings.
      WORKSPACE_ADMIN_EMAILS: dev-bypass@dataq.local
      # Throttling off (#796, compose parity): dev-bypass requests carry no bearer → the whole suite
      # shares one per-IP unauthenticated bucket (120/min) and 429s mid-run.
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements-dev.txt

      - name: Start OpenBao (secret store)
        # A step rather than a `services:` container because the root token is generated per run —
        # service containers start before any step, so their env cannot come from $GITHUB_ENV.
        run: |
          token="$(openssl rand -hex 16)"
          echo "::add-mask::$token"
          echo "OPENBAO_TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name openbao -p 8200:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID="$token" \
            -e BAO_DEV_LISTEN_ADDRESS="0.0.0.0:8200" \
            --cap-add IPC_LOCK openbao/openbao:2.6.1
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8200/v1/sys/health; then
              echo "openbao up"; exit 0
            fi
            sleep 2
          done
          echo "openbao did not come up"; docker logs openbao; exit 1

      - name: Run migrations + seed demo data
        # alembic.ini's script_location is relative to backend/ (compose parity).
        run: |
          (cd backend && alembic upgrade head)
          python -m backend.scripts.seed_dev

      - name: Launch the API
        # Background uvicorn, then block until it serves before Playwright starts.
        run: |
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/connections >/dev/null; then
              echo "api up"; exit 0
            fi
            sleep 2
          done
          echo "api did not come up"; exit 1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        # Split the browser download from its OS deps (#704).
        run: |
          pnpm exec playwright install chromium
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          echo 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci-timeout >/dev/null
          for attempt in 1 2 3; do
            # #1484: a stalled apt mirror hangs rather than exits non-zero, which the retry loop
            # below can't detect on its own.
            if timeout 300 pnpm exec playwright install-deps chromium; then ok=1; break; fi
            # #2320: the signal stops at sudo's `sh -c`, so apt-get survives it and
            # the orphan holds the dpkg lock against every retry.
            sudo pkill -x apt-get || true
            timeout 60 bash -c 'while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done' || true
            sudo dpkg --configure -a || true
            echo "playwright install-deps attempt $attempt failed; retrying in 5s…"; sleep 5
          done
          [ -n "${ok:-}" ] || { echo "playwright install-deps failed after 3 attempts"; exit 1; }

      # ── Static demo (#2419) ────────────────────────────────────────────── Recorded BEFORE the
      # E2E specs, which write to the seeded workspace. Never committed: every run records the
      # API responses behind each route, builds the demo and drives the built files with no API,
      # so a change that breaks the published demo fails here.
      - name: Static demo — record, build, smoke
        working-directory: frontend
        env:
          VITE_API_PROXY_TARGET: http://localhost:8000
        run: |
          pnpm demo:capture
          pnpm demo:build
          pnpm demo:smoke

      - name: Upload the static demo
        uses: actions/upload-artifact@v7
        with:
          name: demo-site
          path: frontend/dist-demo/
          if-no-files-found: error
          retention-days: 7

      - name: Playwright E2E
        working-directory: frontend
        # CI=true → Playwright starts its own Vite dev server (proxying to the
        # api on :8000) and applies forbidOnly + flaky-retries.
        env:
          VITE_API_PROXY_TARGET: http://localhost:8000
        run: pnpm e2e

      # ── Email-OTP lane (ADR 0032, #736) ────────────────────────────────── A SECOND api, because
      # the auth seam picks its mode at import time and OTP wins over dev-bypass.
      - name: Start the OTP stack (SMTP sink + otp-mode api + worker)
        env:
          # Its own database, so the dev-bypass lane's seeded demo rows and this
          # lane's self-provisioned OTP users can never interfere.
          DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_otp_e2e
        run: |
          # Derive the maintenance connection from DATABASE_URL rather than
          # repeating the credentials — one fewer literal in a tracked file.
          ADMIN_URL="${DATABASE_URL/postgresql+psycopg2/postgresql}"
          psql "${ADMIN_URL%/*}/postgres" -c 'CREATE DATABASE dataq_otp_e2e'
          (cd backend && alembic upgrade head)
          scripts/e2e-otp-stack.sh

      - name: Playwright E2E — email OTP
        working-directory: frontend
        env:
          E2E_OTP: "1"
        run: pnpm e2e:otp

      - name: OTP stack logs on failure
        if: ${{ failure() }}
        run: |
          for f in /tmp/dataq-otp-lane*/api.log /tmp/dataq-otp-lane*/sink.log /tmp/dataq-otp-lane*/worker.log; do
            [ -f "$f" ] && { echo "── $f ──"; cat "$f"; }
          done || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  publish-demo:
    name: Publish the static demo
    # Every push to main republishes the demo that frontend-e2e just recorded and built (#2419).
    # The build is kept as the single commit of the `demo-site` branch — force-pushed, so it
    # never accumulates history — and docs.yml, the one Pages deployer, puts it at /demo/.
    needs: frontend-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: demo-site
          path: demo

      - name: Push the build to the demo-site branch
        working-directory: demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f index.html && test -f demo-fixtures.json
          git init -q -b demo-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static demo built from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-site

      - name: Redeploy Pages with the new demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f demo_only=true

  frontend-audit:
    # Job name kept verbatim: it is the pinned required-check context on the main ruleset (same rule
    # as the `secrets` job) — renaming it un-gates the branch.
    name: Frontend — dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit lockfile via the npm bulk advisory endpoint (high+)
        # npm retired the legacy audit endpoints on 2026-07-15 (410) and no RELEASED pnpm speaks the
        # bulk endpoint yet (pnpm#11265; verified vs 11.13.1).
        run: |
          npm install --prefix scripts --no-save --no-package-lock semver@7.8.5
          node scripts/audit_bulk.cjs --audit-level=high

  # ── CodeQL SAST ──────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@v4.38.2

      - uses: github/codeql-action/analyze@v4.38.2
