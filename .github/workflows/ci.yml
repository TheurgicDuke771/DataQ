name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: pip install -r backend/requirements-tooling.txt

      - name: Black (format check)
        run: black --check backend/

      - name: Ruff (lint)
        run: ruff check backend/

      - name: Typecheck-deps in sync
        # Guard the pre-commit mypy hook against backend/requirements-typecheck.txt (Dependabot
        # bumps the requirements file but bypasses the local hook — this catches the drift in CI,
        # which previously slipped through).
        run: python scripts/check-typecheck-deps.py

      - name: Pre-commit tooling pins in sync
        # Same shape, for ruff/black/mypy's own `rev:`s (#1473) — otherwise
        # "pre-commit passing" stops being evidence CI will pass.
        run: python scripts/check-precommit-tooling-sync.py

  backend-types:
    name: Backend — type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install type-check deps
        # mypy from the tooling file; the typed subset it checks against.
        run: |
          pip install -r backend/requirements-tooling.txt
          pip install -r backend/requirements-typecheck.txt

      - name: mypy
        run: mypy backend/app/

  backend-sast:
    name: Backend — SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Bandit
        run: pip install -r backend/requirements-tooling.txt

      - name: Bandit
        run: bandit -c pyproject.toml -r backend/app/

  backend-audit:
    name: Backend — dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==2.10.0

      - name: pip-audit (full runtime + test surface)
        # Synchronous CVE gate over the entire runtime + test dependency tree (single source:
        # requirements-dev.txt) + transitive deps, against the PyPI/OSV advisory DB.
        run: |
          audit() {
            pip-audit -r backend/requirements-dev.txt
          }
          for attempt in 1 2 3 4; do
            if audit; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pip-audit attempt $attempt failed (likely a transient PyPI/OSV 5xx) — retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::pip-audit failed after 4 attempts — a real CVE or a persistent PyPI/OSV outage (see log above)"
          exit 1

  backend-test:
    name: Backend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ephemeral Postgres for DB-backed integration tests (seed/run/endpoint).
    services:
      postgres:
        image: ghcr.io/theurgicduke771/ci-postgres:16-alpine
        env:
          POSTGRES_USER: dataq
          POSTGRES_PASSWORD: dataq
          POSTGRES_DB: dataq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis broker for the real-broker E2E (dispatch -> worker round-trip).
      redis:
        # GHCR mirror of redis:7-alpine (#993 rate limits). The :7 tag is a SECURITY
        # gate, not staleness — Redis 8 bundles Vector Sets (unpatched RCE); Dependabot
        # does not watch service images. Read #980 before any bump.
        image: ghcr.io/theurgicduke771/ci-redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test deps
        # Single source of truth: runtime + typed subset + test toolchain, all
        # from backend/requirements-dev.txt. pip upgraded for PYSEC-2026-196.
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements-dev.txt

      - name: mypy (tests)
        # The slim `Backend — type check` job mypies backend/app against the typed subset; this
        # gates backend/tests too — run here.
        run: mypy backend/tests/

      - name: pytest
        # TEST_DATABASE_URL enables the db_session fixture; DATABASE_URL + REDIS_URL + DATAQ_E2E
        # together enable the real-broker E2E (test_probe_e2e — DATAQ_E2E is the explicit-opt-in
        # signal conftest.py's DATABASE_URL auto-redirect (#1130) can never set on its own, so this
        # test stays a conscious choice even here).
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_test
          DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_test
          REDIS_URL: redis://localhost:6379/0
          DATAQ_E2E: "1"
        run: pytest backend/tests/

  # ── Leak prevention: secrets (betterleaks) + identifiers (#1472) ───────────── The job keeps its
  # original NAME because that string is the required-status-check context in the `main` ruleset.
  secrets:
    name: Secret scanning (betterleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scan only the commits THIS event introduces, not the whole history.
      - name: Compute commit range to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "logopts=--no-merges ${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # new branch / no parent on record — scan just the tip commit
            echo "logopts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "logopts=--no-merges ${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          fi

      # Betterleaks has no official GitHub Action; run the official pinned container image.
      - name: Run betterleaks (incremental — only this event's new commits)
        env:
          LOGOPTS: ${{ steps.range.outputs.logopts }}
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/betterleaks/betterleaks:v1.4.1 \
            git /repo --config /repo/.betterleaks.toml --redact --verbose \
            --git-workers=4 \
            --log-opts="$LOGOPTS"

      # Backstop for the pre-commit hooks of the same name.
      - name: No personal or live-infrastructure identifiers
        run: python scripts/check-identifiers.py

      - name: Every doc declares published or not
        run: python scripts/check-docs-publication.py

      - name: Published docs don't cite tickets or link internal docs
        run: python scripts/check-docs-references.py

      - name: Frontend UI text doesn't cite ADR/issue/PR numbers
        run: python scripts/check-frontend-no-ticket-refs.py

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

  frontend-test:
    name: Frontend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest (80% line-coverage gate — CI-enforced since the v1 W8 flip)
        run: pnpm test:coverage

  frontend-e2e:
    name: Frontend — browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Full-stack browser smoke (#128): real API + seeded demo data + dev-bypass, driven through the
    # React UI.
    services:
      postgres:
        image: ghcr.io/theurgicduke771/ci-postgres:16-alpine
        env:
          POSTGRES_USER: dataq
          POSTGRES_PASSWORD: dataq
          POSTGRES_DB: dataq_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        # GHCR mirror of redis:7-alpine (#993 rate limits). The :7 tag is a SECURITY
        # gate, not staleness — Redis 8 bundles Vector Sets (unpatched RCE); Dependabot
        # does not watch service images. Read #980 before any bump.
        image: ghcr.io/theurgicduke771/ci-redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_e2e
      REDIS_URL: redis://localhost:6379/0
      # api + seed must share the secret store so secrets the seed writes are readable by the api
      # (compose parity).
      SECRET_STORE: openbao
      OPENBAO_ADDR: http://localhost:8200
      AUTH_DEV_BYPASS: "true"
      ENVIRONMENT: dev
      # dev-bypass identity is workspace admin (compose parity, ADR 0027) so
      # admin.spec.ts can drive /admin + /settings.
      WORKSPACE_ADMIN_EMAILS: dev-bypass@dataq.local
      # Throttling off (#796, compose parity): dev-bypass requests carry no bearer → the whole suite
      # shares one per-IP unauthenticated bucket (120/min) and 429s mid-run.
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements-dev.txt

      - name: Start OpenBao (secret store)
        # A step rather than a `services:` container because the root token is generated per run —
        # service containers start before any step, so their env cannot come from $GITHUB_ENV.
        run: |
          token="$(openssl rand -hex 16)"
          echo "::add-mask::$token"
          echo "OPENBAO_TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name openbao -p 8200:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID="$token" \
            -e BAO_DEV_LISTEN_ADDRESS="0.0.0.0:8200" \
            --cap-add IPC_LOCK openbao/openbao:2.6.1
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8200/v1/sys/health; then
              echo "openbao up"; exit 0
            fi
            sleep 2
          done
          echo "openbao did not come up"; docker logs openbao; exit 1

      - name: Run migrations + seed demo data
        # alembic.ini's script_location is relative to backend/ (compose parity).
        run: |
          (cd backend && alembic upgrade head)
          python -m backend.scripts.seed_dev

      - name: Launch the API
        # Background uvicorn, then block until it serves before Playwright starts.
        run: |
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/connections >/dev/null; then
              echo "api up"; exit 0
            fi
            sleep 2
          done
          echo "api did not come up"; exit 1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        # Split the browser download from its OS deps (#704).
        run: |
          pnpm exec playwright install chromium
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          for attempt in 1 2 3; do
            # #1484: a stalled apt mirror hangs rather than exits non-zero, which the retry loop
            # below can't detect on its own.
            if timeout 300 pnpm exec playwright install-deps chromium; then ok=1; break; fi
            echo "playwright install-deps attempt $attempt failed; retrying in 5s…"; sleep 5
          done
          [ -n "${ok:-}" ] || { echo "playwright install-deps failed after 3 attempts"; exit 1; }

      - name: Playwright E2E
        working-directory: frontend
        # CI=true → Playwright starts its own Vite dev server (proxying to the
        # api on :8000) and applies forbidOnly + flaky-retries.
        env:
          VITE_API_PROXY_TARGET: http://localhost:8000
        run: pnpm e2e

      # ── Email-OTP lane (ADR 0032, #736) ────────────────────────────────── A SECOND api, because
      # the auth seam picks its mode at import time and OTP wins over dev-bypass.
      - name: Start the OTP stack (SMTP sink + otp-mode api)
        env:
          # Its own database, so the dev-bypass lane's seeded demo rows and this
          # lane's self-provisioned OTP users can never interfere.
          DATABASE_URL: postgresql+psycopg2://dataq:dataq@localhost:5432/dataq_otp_e2e
        run: |
          # Derive the maintenance connection from DATABASE_URL rather than
          # repeating the credentials — one fewer literal in a tracked file.
          ADMIN_URL="${DATABASE_URL/postgresql+psycopg2/postgresql}"
          psql "${ADMIN_URL%/*}/postgres" -c 'CREATE DATABASE dataq_otp_e2e'
          (cd backend && alembic upgrade head)
          scripts/e2e-otp-stack.sh

      - name: Playwright E2E — email OTP
        working-directory: frontend
        env:
          E2E_OTP: "1"
        run: pnpm e2e:otp

      - name: OTP stack logs on failure
        if: ${{ failure() }}
        run: |
          for f in /tmp/dataq-otp-lane*/api.log /tmp/dataq-otp-lane*/sink.log; do
            [ -f "$f" ] && { echo "── $f ──"; cat "$f"; }
          done || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  frontend-audit:
    # Job name kept verbatim: it is the pinned required-check context on the main ruleset (same rule
    # as the `secrets` job) — renaming it un-gates the branch.
    name: Frontend — dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit lockfile via the npm bulk advisory endpoint (high+)
        # npm retired the legacy audit endpoints on 2026-07-15 (410) and no RELEASED pnpm speaks the
        # bulk endpoint yet (pnpm#11265; verified vs 11.13.1).
        run: |
          npm install --prefix scripts --no-save --no-package-lock semver@7.8.5
          node scripts/audit_bulk.cjs --audit-level=high

  # ── CodeQL SAST ──────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.8
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@v4.37.8

      - uses: github/codeql-action/analyze@v4.37.8
