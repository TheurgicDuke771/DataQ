version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # GX Core is manually pinned — do not auto-update (API drifts across point releases)
      - dependency-name: great-expectations
      # redis-py 8.x (Redis-8-aligned renumber) is capped by kombu's [redis] extra (redis<6.5); no
      # released celery/kombu allows it yet.
      - dependency-name: redis
        update-types:
          - version-update:semver-major
      # SQLAlchemy 2.1 drops the mypy plugin pyproject.toml loads, and snowflake-sqlalchemy 1.11.x
      # fails to import under it (#2181). 2.0.x patches still flow; the migration is #2275 —
      # delete this entry there.
      - dependency-name: sqlalchemy
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      # The OTel SDK and its instrumentations pin each other exactly (sdk 1.N needs
      # semantic-conventions 0.Nb0, which instrumentation 0.Nb0 also pins), so a lone bump is
      # ResolutionImpossible (#2184). One PR moves them together. The Azure exporter must ride
      # along: 1.0.0b57 requires opentelemetry-sdk~=1.44.0, so the SDK can only move once an
      # exporter release accepts the new minor — until then the grouped PR fails CI, not prod.
      opentelemetry:
        patterns:
          - opentelemetry-*
          - azure-monitor-opentelemetry-exporter

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # Vitest 5 is a deliberate migration, not a routine bump: it inlines the `expect` package, so
      # @testing-library/jest-dom's matcher types stop augmenting vitest's Assertion (tsc fails).
      # Closing the grouped PR (#2038) does not stop future 5.x PRs; remove this with #2070.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
