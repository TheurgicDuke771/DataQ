name: "DataQ CodeQL config"

# Inherit the full security-and-quality suite, then trim known false positives.
queries:
  - uses: security-and-quality

paths-ignore:
  # Alembic migrations + env.py read module-level globals (revision, down_revision, branch_labels,
  # depends_on) via inspection and intentionally import models for autogenerate side-effects.
  - backend/alembic/**

query-filters:
  # py/ineffectual-statement fires on the `...` body of Protocol method stubs: class
  # SecretStore(Protocol): def get(self.
  - exclude:
      id: py/ineffectual-statement
