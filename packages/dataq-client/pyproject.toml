[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dataq-client"
# Tracks the DataQ server version it is generated from; the release workflow refuses a tag that
# does not match.
version = "1.2.0"
description = "Python client and CLI for the DataQ REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  # What the generated layer imports. Ranges, not pins: this is a library.
  "httpx>=0.23.0,<0.29.0",
  "attrs>=22.2.0",
  "python-dateutil>=2.8.0",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.scripts]
dataq = "dataq_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataq_client"]

[tool.mypy]
# Self-contained: the repo-root config loads backend plugins (SQLAlchemy) this package never has.
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
# Self-contained: the repo-root config adds backend coverage flags.
testpaths = ["tests"]
