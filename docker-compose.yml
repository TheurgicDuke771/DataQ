# Two env files (split in #209 so app Settings can run extra="forbid"): .env — infra/compose only:
# POSTGRES_* (+ VITE_* for the frontend).
x-database-url: &database-url "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

# ── Sign-in mode: ONE switch, DATAQ_SIGNIN_EMAIL (#1150) ────────────────────── This stack boots
# into **email one-time codes** (ADR 0032), not dev-bypass.
x-otp-auth-env: &otp-auth-env
  # The developer bypass is an explicit opt-in (DATAQ_DEV_BYPASS=true in the root .env), never a
  # fallback: the api refuses to boot with it beside a real sign-in mode (#1901).
  AUTH_DEV_BYPASS: ${DATAQ_DEV_BYPASS:-false}
  # Defaults to the bundled catcher; the ROOT `.env` overrides any of these while the switch is set.
  AUTH_EMAIL_SMTP_HOST: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_SMTP_HOST:-mailpit}}
  AUTH_EMAIL_SMTP_PORT: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_SMTP_PORT:-1025}}
  # A local catcher on the compose network speaks no TLS, which is exactly the case `none` exists
  # for (#1146) — it is loudly warned on every send.
  AUTH_EMAIL_TLS_MODE: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_TLS_MODE:-none}}
  # A SecretStore lookup NAME, never a value — the password is generated into the vault by the `otp-
  # mail-secret` one-shot below and read back by name.
  AUTH_EMAIL_PASSWORD_SECRET_NAME: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_PASSWORD_SECRET_NAME:-dataq-local-smtp}}
  # Non-secret identifiers. Mailpit accepts ANY credentials (MP_SMTP_AUTH_ACCEPT_ANY),
  # so what matters is only that the api's real AUTH exchange happens.
  AUTH_EMAIL_USERNAME: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_USERNAME:-dataq-local}}
  AUTH_EMAIL_FROM: ${DATAQ_SIGNIN_EMAIL:+${AUTH_EMAIL_FROM:-dataq@dataq.local}}
  # Signup allowlist — mandatory, there is no open registration (ADR 0032 decision 5).
  AUTH_OTP_ALLOWED_EMAILS: ${DATAQ_SIGNIN_EMAIL?set DATAQ_SIGNIN_EMAIL=you@example.com to sign in with an emailed code (read it at http://localhost:8025). Developers only — set it EMPTY and DATAQ_DEV_BYPASS=true for the no-sign-in bypass}
  # Shadowed too, and blank by default — otherwise a lone `AUTH_OTP_ALLOWED_DOMAINS` left in
  # `.env.app` would survive the downgrade.
  AUTH_OTP_ALLOWED_DOMAINS: ${DATAQ_SIGNIN_EMAIL:+${AUTH_OTP_ALLOWED_DOMAINS:-}}
  # Whoever booted the stack is its admin; the dev-bypass identity is listed only when opted in.
  WORKSPACE_ADMIN_EMAILS: ${WORKSPACE_ADMIN_EMAILS-${DATAQ_DEV_BYPASS:+dev-bypass@dataq.local,}${DATAQ_SIGNIN_EMAIL:-}}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Pinned to 7.x deliberately — Redis 8 bundles the Vector Sets module, which carries an
    # unpatched duplicate-HNSW-ID RCE (see #980 before bumping).
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback ONLY (#1407) — Redis carries no auth at all, so a LAN-wide bind hands anyone on the
      # network the Celery broker: passively watch every task dispatched, flush the queue.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Credential store for the api + worker (ADR 0039), replacing the plaintext RedisSecretStore.
  openbao:
    image: openbao/openbao:2.6.1
    restart: unless-stopped
    # BAO_DEV_ROOT_TOKEN_ID is a CREDENTIAL, so it is never defaulted in this tracked file
    # (CLAUDE.md §11) — scripts/setup.sh generates it into the gitignored .env.
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN:?run ./scripts/setup.sh (or set OPENBAO_TOKEN) — ADR 0039}
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      # Loopback ONLY — unlike the postgres line above, this holds the real warehouse credentials a
      # developer entered, behind nothing but a root token sitting in .env on the same machine.
      - "127.0.0.1:8200:8200"
    cap_add:
      # OpenBao locks its memory so secrets cannot be swapped to disk.
      - IPC_LOCK
    healthcheck:
      # 200 = initialized+unsealed+active. Dev mode unseals itself, but gating on
      # health keeps api/worker from racing the vault on a cold start.
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Bundled mail catcher — the local mailbox for OTP sign-in (#1150) ─────────
  # Mailpit (MIT — rule 40 / ADR 0031 clear) catches every message DataQ sends and
  # serves it in a web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      # Accept any username/password, over a plain connection.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Everything is in memory — this is a test inbox, and sign-in codes are
      # single-use and expire in 10 minutes. Nothing here should outlive the stack.
      MP_MAX_MESSAGES: "500"
    ports:
      # Loopback ONLY.
      - "127.0.0.1:8025:8025"   # web inbox — open this to read your code
      - "127.0.0.1:1025:1025"   # SMTP, for host-side dev (uvicorn on your machine)
    healthcheck:
      # The image is distroless-ish (no curl/wget); mailpit ships its own probe.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: puts a generated SMTP password in the vault under the name the api looks it up by,
  # then exits 0 (see the module docstring for why the mailer has no "no password" path).
  otp-mail-secret:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: python -m backend.scripts.seed_local_smtp_secret
    env_file:
      - path: .env.app
        required: false
    environment:
      SECRET_STORE: ${SECRET_STORE:-openbao}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?run ./scripts/setup.sh (or set OPENBAO_TOKEN) — ADR 0039}
      # The SAME block the api gets, not just the secret name: this process builds the same
      # `Settings`.
      <<: *otp-auth-env
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      openbao:
        condition: service_healthy

  # One-shot: applies Alembic migrations then exits 0. api/worker wait on it via
  # service_completed_successfully so `docker compose up` never serves an un-migrated schema (#156).
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: sh -c "cd backend && alembic upgrade head"
    env_file:
      - path: .env.app
        required: false
    environment:
      DATABASE_URL: *database-url
      # Carries the same auth block as everything else that builds `Settings`.
      <<: *otp-auth-env
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy

  # FastAPI + Celery share one image (backend/Dockerfile, conda env `dataq`).
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - path: .env.app
        required: false
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      # Shared across api + worker so a credential the API writes at runtime is readable by
      # connection-driven worker runs (#86) — EnvSecretStore is per-process and cannot do that.
      SECRET_STORE: ${SECRET_STORE:-openbao}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?run ./scripts/setup.sh (or set OPENBAO_TOKEN) — ADR 0039}
      # Sign-in mode + the bundled mail catcher — see x-otp-auth-env at the top.
      <<: *otp-auth-env
      # Request throttling off in the dev stack (#796): dev-bypass traffic carries no bearer, so a
      # local Playwright run lands in the per-IP unauthenticated class (120/min) and 429s mid-suite.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
    volumes:
      # Bind-mount source for hot reload; the conda env in the image is untouched.
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otp-mail-secret:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # -B runs celery-beat embedded in the worker (the #171 orchestration polling schedule) — dev
    # AND prod alike (containerapps.tf runs the same `worker -B`; there is no separate beat process
    # anywhere, #1091). -Q celery,llm (#1777): llm_invoke has its own queue now — a worker not
    # listening to it here would silently never process an LLM dispatch.
    command: celery -A backend.app.worker.celery_app worker -B -Q celery,llm --loglevel=INFO
    env_file:
      - path: .env.app
        required: false
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      # Must match the api service so secrets the API writes are visible here (#86).
      SECRET_STORE: ${SECRET_STORE:-openbao}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?run ./scripts/setup.sh (or set OPENBAO_TOKEN) — ADR 0039}
      # Same auth block as the api.
      <<: *otp-auth-env
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otp-mail-secret:
        condition: service_completed_successfully

  # React/Vite dev server. corepack pins pnpm from package.json's packageManager. node_modules is
  # an anonymous volume so the host's (possibly macOS-built) copy doesn't clobber the container's.
  # pnpm's ~300MB content-addressable store is relocated to /pnpm-store (OUTSIDE the ./frontend
  # bind) and held in its own volume — so nothing leaks into, or creates an empty mountpoint under,
  # the host working tree.
  frontend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm config set store-dir /pnpm-store && pnpm install && pnpm dev --host"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      # Pass the client-side auth vars into the Vite dev server.
      VITE_AUTH_MODE: ${DATAQ_SIGNIN_EMAIL:+otp}
      VITE_AUTH_DEV_BYPASS: ${DATAQ_DEV_BYPASS:-false}
      VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
      VITE_AZURE_SPA_CLIENT_ID: ${VITE_AZURE_SPA_CLIENT_ID:-}
      VITE_AZURE_API_CLIENT_ID: ${VITE_AZURE_API_CLIENT_ID:-}
      VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE:-user_impersonation}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - pnpm-store:/pnpm-store
    depends_on:
      - api

  # ─────────────────────────── lineage (opt-in) ──────────────────────────── Marquez (Apache-2.0)
  # — the reference `LineageProvider` catalog (ADR 0034, #762): DataQ's OpenLineage emitter (#758)
  # feeds it, and the daily `refresh_lineage_pull` beat task pulls the graph back into the
  # `lineage_edges` cache.
  marquez-db:
    image: postgres:16-alpine
    profiles: ["lineage"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: marquez
      POSTGRES_DB: marquez
      # trust auth: this is an isolated, network-internal, opt-in dev DB that holds no
      # real data, so no password secures it (no credential is committed — CLAUDE.md).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - marquez_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      timeout: 3s
      retries: 10

  marquez:
    image: marquezproject/marquez:0.50.0
    profiles: ["lineage"]
    restart: unless-stopped
    # entrypoint waits for the DB, runs Flyway migrations, then serves the API (5000)
    # + admin (5001). No secret: the DB uses trust auth (POSTGRES_PASSWORD is unused).
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      # Unused (marquez-db runs trust auth) — kept only because Marquez's JDBC config requires the
      # var to exist.
      POSTGRES_PASSWORD: "${MARQUEZ_DB_PASSWORD:-}"
    ports:
      # Host 5002/5003: macOS binds 5000 (AirPlay Receiver) by default.
      - "127.0.0.1:5002:5000"
      - "127.0.0.1:5003:5001"
    depends_on:
      marquez-db:
        condition: service_healthy

  # ── Local OTLP consumer (opt-in: `docker-compose --profile telemetry up`) ──── The non-Azure half
  # of the observability seam (#589/#591).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["telemetry"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # Loopback ONLY — unauthenticated UI + OTLP receiver (#1407 class).
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4318:4318"    # OTLP/HTTP receiver (the endpoint DataQ exports to)

volumes:
  postgres_data:
  pnpm-store:
  marquez_db_data:
