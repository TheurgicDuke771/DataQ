site_name: DataQ
site_description: >-
  DataQ — a single-tenant data-quality monitoring platform built on Great
  Expectations. User-friendly guides + developer references.
site_url: https://theurgicduke771.github.io/DataQ/docs/
repo_url: https://github.com/TheurgicDuke771/DataQ
repo_name: TheurgicDuke771/DataQ
edit_uri: edit/main/docs/site/

# The site is rooted at docs/site/ — LOCATION IS THE PUBLICATION DECISION.
# Everything under docs/site/ is published (ADRs included); internal planning
# docs live directly under docs/ where MkDocs never sees them. This replaces
# the old exclude_docs allowlist, whose default-published failure mode put two
# internal files (incl. the ops log) on the public site.
docs_dir: docs/site
# Built one level down so the Pages root (marketing/index.html, copied in by
# the Docs workflow) can occupy the bare repo URL; docs live at /docs/.
site_dir: site/docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo # matches the app's indigo brand
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Plain-language modules first (audience: PMs / data engineers / SREs / QA /
# non-technical stakeholders), then developer references. Each module is short
# and links out to the in-repo source of truth rather than duplicating it.
nav:
  - Home: index.md
  - Guides:
      - Getting started: getting-started.md
      - Tutorial — your first suite: tutorial.md
      - Concepts: concepts.md
      - Features: features.md
      - Datasources & checks: datasources-checks.md
      - Scheduling: scheduling.md
      - Orchestration: orchestration.md
      - Notifications & alerting: notifications.md
      - AI assistants (MCP setup): mcp-setup.md
      - API keys (PATs): api-keys.md
      - Recommended usage: recommended-usage.md
      - Best practices: best-practices.md
  - Reference:
      - Feature matrix: feature-matrix.md
      - REST API: rest-api.md
      - MCP tool design (honesty & disclosure): mcp-honesty.md
      - Architecture: architecture.md
      - Security & data handling: security.md
      - Compliance:
          - Sub-processor disclosure: compliance/sub-processors.md
          - DPIA input sheet: compliance/dpia-input-sheet.md
          - Data-subject-rights runbook: compliance/data-subject-rights-runbook.md
          - Breach-notification runbook: compliance/breach-notification-runbook.md
          - DPA / BAA templates (counsel-gated): compliance/dpa-baa-templates.md
      - Deployment: deployment.md
      - Deployment parity (Azure · AWS · Local): deployment-parity.md
      - Observability: observability.md
      - Performance baseline: perf-baseline.md
      - Troubleshooting: troubleshooting.md
      - Runbook & FAQ: runbook-faq.md
      - Changelog: changelog.md
      - Glossary: glossary.md
      - Contributing: contributing.md

# Internal planning docs live at docs/ (outside docs_dir), so no exclude_docs
# is needed: a file must be MOVED into docs/site/ to publish at all.
validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
