site_name: DataQ
site_description: >-
  DataQ — a single-tenant data-quality monitoring platform built on Great
  Expectations. User-friendly guides + developer references.
site_url: https://theurgicduke771.github.io/DataQ/docs/
repo_url: https://github.com/TheurgicDuke771/DataQ
repo_name: TheurgicDuke771/DataQ
edit_uri: edit/main/docs/site/

# The site is rooted at docs/site/ — LOCATION IS THE PUBLICATION DECISION.
# Everything under docs/site/ is published (ADRs included); internal planning
# docs live directly under docs/ where MkDocs never sees them. This replaces
# the old exclude_docs allowlist, whose default-published failure mode put two
# internal files (incl. the ops log) on the public site.
docs_dir: docs/site
# Built one level down so the Pages root (marketing/index.html, copied in by
# the Docs workflow) can occupy the bare repo URL; docs live at /docs/.
site_dir: site/docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo # matches the app's indigo brand
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - search.share

plugins:
  - search
  - glightbox: # click-to-zoom on every screenshot (MIT)
      touchNavigation: true
      skip_classes: [no-zoom]
  - redirects: # old URLs keep working after the 2026-09 reorganisation (MIT)
      redirect_maps:
        getting-started.md: get-started/install.md
        tutorial.md: get-started/first-suite.md
        concepts.md: get-started/concepts.md
        features.md: guides/features.md
        datasources-checks.md: guides/datasources-checks.md
        scheduling.md: guides/scheduling.md
        orchestration.md: guides/orchestration.md
        notifications.md: guides/notifications.md
        mcp-setup.md: guides/mcp-setup.md
        api-keys.md: guides/api-keys.md
        recommended-usage.md: guides/recommended-usage.md
        best-practices.md: guides/best-practices.md
        feature-matrix.md: reference/feature-matrix.md
        rest-api.md: reference/rest-api.md
        glossary.md: reference/glossary.md
        changelog.md: reference/changelog.md
        mcp-honesty.md: architecture/mcp-honesty.md
        evidence-card.md: architecture/evidence-card.md
        perf-baseline.md: architecture/perf-baseline.md
        contributing.md: architecture/contributing.md
        compliance/sub-processors.md: security/compliance/sub-processors.md
        compliance/dpia-input-sheet.md: security/compliance/dpia-input-sheet.md
        compliance/data-subject-rights-runbook.md: security/compliance/data-subject-rights-runbook.md
        compliance/breach-notification-runbook.md: security/compliance/breach-notification-runbook.md
        compliance/dpa-baa-templates.md: security/compliance/dpa-baa-templates.md
        deployment.md: operate/deployment.md
        deployment-parity.md: operate/deployment-parity.md
        observability.md: operate/observability.md
        troubleshooting.md: operate/troubleshooting.md
        runbook-faq.md: operate/runbook-faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Plain-language modules first (audience: PMs / data engineers / SREs / QA /
# non-technical stakeholders), then developer references. Each module is short
# and links out to the in-repo source of truth rather than duplicating it.
nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Install: get-started/install.md
      - Your first suite: get-started/first-suite.md
      - Concepts: get-started/concepts.md
  - Guides:
      - guides/index.md
      - Features overview: guides/features.md
      - Datasources & checks: guides/datasources-checks.md
      - Scheduling: guides/scheduling.md
      - Orchestration: guides/orchestration.md
      - Notifications & alerting: guides/notifications.md
      - AI assistants (MCP): guides/mcp-setup.md
      - API keys (PATs): guides/api-keys.md
      - Recommended usage: guides/recommended-usage.md
      - Best practices: guides/best-practices.md
  - Reference:
      - reference/index.md
      - Feature matrix: reference/feature-matrix.md
      - REST API: reference/rest-api.md
      - Glossary: reference/glossary.md
      - Changelog: reference/changelog.md
  - Architecture:
      - architecture/index.md
      - System architecture: architecture/overview.md
      - Decision records (ADRs): adr/README.md
      - MCP tool design (honesty): architecture/mcp-honesty.md
      - Incident evidence card: architecture/evidence-card.md
      - Performance baseline: architecture/perf-baseline.md
      - Contributing: architecture/contributing.md
  - Security & compliance:
      - security/index.md
      - Security & data handling: security/overview.md
      - Compliance:
          - Sub-processor disclosure: security/compliance/sub-processors.md
          - DPIA input sheet: security/compliance/dpia-input-sheet.md
          - Data-subject-rights runbook: security/compliance/data-subject-rights-runbook.md
          - Breach-notification runbook: security/compliance/breach-notification-runbook.md
          - DPA / BAA templates (counsel-gated): security/compliance/dpa-baa-templates.md
  - Operate:
      - operate/index.md
      - Deployment: operate/deployment.md
      - Deployment parity (Azure · AWS · Local): operate/deployment-parity.md
      - Observability: operate/observability.md
      - Troubleshooting: operate/troubleshooting.md
      - Runbook & FAQ: operate/runbook-faq.md

# Internal planning docs live at docs/ (outside docs_dir), so no exclude_docs
# is needed: a file must be MOVED into docs/site/ to publish at all.
validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
