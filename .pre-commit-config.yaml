repos:
  # ── Python lint / format / types (#2080) ────────────────────────────────────
  #
  # `language: system` on purpose: these run the copies the conda env installed from
  # backend/requirements-tooling.txt + requirements-typecheck.txt — the same files CI
  # installs — so there is no second list of versions here to drift. (Remote hooks
  # pinned by `rev:` + mypy `additional_dependencies` were that second list, and
  # Dependabot, which only edits the pip files, turned every bump red.)
  # scripts/run-pinned-tool.py refuses to run if the env's versions differ from the
  # pins, so a stale env fails loudly instead of checking with the wrong version.

  # Linting + import sorting (runs first so Black formats the fixed code).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python scripts/run-pinned-tool.py ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Formatting (canonical formatter — runs last to own final layout).
      - id: black
        name: black
        entry: python scripts/run-pinned-tool.py black
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Type checking — same flags as CI's `mypy backend/app/` (config in pyproject.toml).
      - id: mypy
        name: mypy
        entry: python scripts/run-pinned-tool.py mypy
        language: system
        files: ^backend/app/
        types_or: [python, pyi]
        require_serial: true

  # ── Identifier + publication guards (#1472) ─────────────────────────────────
  #
  # Distinct from betterleaks below, which finds SECRETS. A secret that leaks is
  # revoked and rotated; an identifier cannot be, because it names something real
  # that keeps existing — so these two run on top rather than instead.
  - repo: local
    hooks:
      - id: check-identifiers
        name: No personal or live-infrastructure identifiers
        entry: python scripts/check-identifiers.py
        language: system
        # Every text file: an identifier leaks as readily from a test fixture or a
        # .tf default as from prose. Binary/vendored paths are skipped in-script.
        exclude: ^(node_modules/|frontend/dist/|site/)
      - id: check-docs-publication
        name: Every doc declares published or not
        entry: python scripts/check-docs-publication.py
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|mkdocs\.yml|scripts/check-docs-publication\.py)$
      - id: check-docs-references
        name: Published docs don't cite tickets or link internal docs
        entry: python scripts/check-docs-references.py
        language: system
        pass_filenames: false
        files: ^(docs/site/.*\.md|scripts/check-docs-references\.py)$
      - id: check-docs-assets
        name: Docs assets stay small and every image has alt text
        entry: python scripts/check-docs-assets.py
        language: system
        pass_filenames: false
        files: ^(docs/site/.*|scripts/check-docs-assets\.py)$
      - id: check-check-catalog-docs
        name: Check-type reference is generated from the catalog + allowlist
        entry: python scripts/docs/gen-check-catalog.py --check
        language: system
        pass_filenames: false
        files: ^(frontend/src/components/checks/expectationCatalog\.ts|frontend/scripts/dump-catalog\.mts|backend/app/datasources/(expectation_allowlist|unity_catalog)\.py|docs/site/reference/check-types\.md|scripts/docs/gen-check-catalog\.py)$
      - id: check-frontend-no-ticket-refs
        name: Frontend UI text doesn't cite ADR/issue/PR numbers
        entry: python scripts/check-frontend-no-ticket-refs.py
        language: system
        files: ^frontend/src/.*\.tsx?$
        exclude: \.(test|spec)\.tsx?$

  # ── Secret scanning ─────────────────────────────────────────────────────────
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.4.1
    hooks:
      - id: betterleaks

  # ── General hygiene ─────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve markdown's trailing-double-space line-break syntax in .md files
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe = syntax-check only, no object construction: mkdocs.yml uses
        # mkdocs-material's `!!python/name:` tag, which the default loader refuses.
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key         # belt-and-suspenders alongside betterleaks
      - id: no-commit-to-branch
        args: [--branch, main]         # prevents direct commits to main
