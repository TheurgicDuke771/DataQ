# Throwaway Postgres, Redis, OpenBao (dev mode, in memory) and Mailpit for the kind smoke test
# only. Never a production pattern: the chart expects these to be managed services you own.
# Credentials come from the `smoke-deps` Secret that smoke.sh generates at run time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: dataq}
            - {name: POSTGRES_DB, value: dataq}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: smoke-deps, key: postgres-password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "dataq"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
spec:
  selector:
    matchLabels: {app: openbao}
  template:
    metadata:
      labels: {app: openbao}
    spec:
      containers:
        - name: openbao
          image: openbao/openbao:2.6.1
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              valueFrom: {secretKeyRef: {name: smoke-deps, key: openbao-token}}
          ports: [{containerPort: 8200}]
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
spec:
  selector: {app: openbao}
  ports: [{port: 8200}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  selector:
    matchLabels: {app: mailpit}
  template:
    metadata:
      labels: {app: mailpit}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.30.6
          env:
            - {name: MP_SMTP_AUTH_ACCEPT_ANY, value: "true"}
            - {name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "true"}
          ports: [{containerPort: 1025}, {containerPort: 8025}]
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: {app: mailpit}
  ports:
    - {name: smtp, port: 1025}
    - {name: http, port: 8025}
---
# A sample warehouse for the suite-run check (backend.scripts.seed_demo fills it). Trust auth:
# reachable only inside this throwaway cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-warehouse
spec:
  selector:
    matchLabels: {app: demo-warehouse}
  template:
    metadata:
      labels: {app: demo-warehouse}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
            - {name: POSTGRES_USER, value: demo}
            - {name: POSTGRES_DB, value: shop}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "demo", "-d", "shop"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: demo-warehouse
spec:
  selector: {app: demo-warehouse}
  ports: [{port: 5432}]
