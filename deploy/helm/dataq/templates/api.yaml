{{- include "dataq.validate" . }}
{{- $tls := .Values.api.tls.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataq.fullname" . }}-api
  labels:
    {{- include "dataq.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "dataq.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      {{- include "dataq.podMetadata" (dict "ctx" . "component" "api") | nindent 6 }}
    spec:
      {{- include "dataq.backendPodSpec" (dict "ctx" . "component" "api") | nindent 6 }}
      containers:
        - name: api
          image: {{ include "dataq.image" (dict "ctx" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - backend.app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            {{- if $tls }}
            - --ssl-certfile
            - /etc/dataq/api-tls/tls.crt
            - --ssl-keyfile
            - /etc/dataq/api-tls/tls.key
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            {{- include "dataq.backendEnvFrom" . | nindent 12 }}
            - configMapRef:
                name: {{ include "dataq.fullname" . }}-config
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- include "dataq.probe" (dict "probe" . "tls" $tls) | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- include "dataq.probe" (dict "probe" . "tls" $tls) | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.backendSecurityContext.container | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "dataq.backendVolumeMounts" (dict "ctx" . "telemetry" true) | nindent 12 }}
            {{- if $tls }}
            - name: api-tls
              mountPath: /etc/dataq/api-tls
              readOnly: true
            {{- end }}
      volumes:
        {{- include "dataq.backendVolumes" (dict "ctx" . "telemetry" true) | nindent 8 }}
        {{- if $tls }}
        - name: api-tls
          secret:
            secretName: {{ $tls }}
        {{- end }}
---
# ClusterIP only: the api is never exposed outside the cluster; the frontend proxies to it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataq.fullname" . }}-api
  labels:
    {{- include "dataq.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dataq.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
