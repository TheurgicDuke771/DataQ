{{- include "dataq.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataq.fullname" . }}-worker
  labels:
    {{- include "dataq.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "dataq.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      {{- include "dataq.podMetadata" (dict "ctx" . "component" "worker") | nindent 6 }}
    spec:
      {{- include "dataq.backendPodSpec" (dict "ctx" . "component" "worker") | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "dataq.image" (dict "ctx" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Both queues, or llm tasks are never consumed. No -B: beat is its own Deployment.
          command: ["celery", "-A", "backend.app.worker.celery_app", "worker", "-Q", "celery,llm", "--loglevel=INFO"]
          envFrom:
            {{- include "dataq.backendEnvFrom" . | nindent 12 }}
            - configMapRef:
                name: {{ include "dataq.fullname" . }}-config
          {{- with .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.backendSecurityContext.container | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "dataq.backendVolumeMounts" (dict "ctx" . "telemetry" true) | nindent 12 }}
      volumes:
        {{- include "dataq.backendVolumes" (dict "ctx" . "telemetry" true) | nindent 8 }}
